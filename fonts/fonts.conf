<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>/var/task/fonts</dir>
  <dir prefix="cwd">fonts</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <cachedir>/tmp/fonts-cache</cachedir>

  <!-- Map Calibri to Carlito (Calibri 1:1 metric clone) with Cairo Arabic fallback -->
  <alias>
    <family>Calibri</family>
    <prefer>
      <family>Carlito</family>
      <family>Cairo</family>
    </prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Carlito</family>
      <family>Cairo</family>
    </prefer>
  </alias>

  <alias>
    <family>Segoe UI</family>
    <prefer>
      <family>Carlito</family>
      <family>Cairo</family>
    </prefer>
  </alias>

  <alias>
    <family>Arial</family>
    <prefer>
      <family>Carlito</family>
      <family>Cairo</family>
    </prefer>
  </alias>

  <config></config>
</fontconfig>
